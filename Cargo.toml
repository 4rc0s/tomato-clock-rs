[package]
name = "tomato"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "🍅 Tomato Clock — a straightforward command-line Pomodoro timer"
license = "MIT"
repository = "https://github.com/4rc0s/tomato-clock-rs"
authors = ["4rc0s"]
keywords = ["pomodoro", "cli", "timer", "productivity"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
notify-rust = "4"

# Suspend-aware clock (CLOCK_BOOTTIME / Apple CLOCK_MONOTONIC) for the timer.
[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
